<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cumbre - Panel de Control</title>
  <style>
    :root {
      --azul: #1f436b;
      --azul-oscuro: #173757;
      --blanco: #ffffff;
      --fondo: #f3f6f9;
      --gris: #d7dee6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: var(--fondo);
      color: #333;
    }

    header {
      background: var(--azul);
      color: var(--blanco);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .container {
      padding: 30px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .card {
      background: var(--blanco);
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      border-left: 5px solid var(--azul);
    }

    .card h3 {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 10px;
    }

    .card p {
      font-size: 24px;
      font-weight: bold;
      color: var(--azul-oscuro);
    }
  </style>
</head>
<body>

  <header>
    <h2>Cumbre - Dashboard</h2>
    <span>Usuario: Leonardo Salazar</span>
  </header>

  <div class="container">
    <h1>Bienvenido al Panel Principal</h1>
    <p>Resumen general del sistema.</p>

    <div class="card-grid">
      <div class="card">
        <h3>USUARIOS ACTIVOS</h3>
        <p>124</p>
      </div>
      <div class="card">
        <h3>REPORTES GENERADOS</h3>
        <p>45</p>
      </div>
      <div class="card">
        <h3>ESTADO DEL SISTEMA</h3>
        <p>Optimo</p>
      </div>
    </div>
  </div>

</body>
</html>
